[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-intelligence"
version = "1.0.0"
description = "A Research-Grade Aerial Traffic Intelligence & Trajectory Discovery Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Traffic Intelligence Research Team"}
]
keywords = [
    "aerial-computer-vision",
    "multi-object-tracking",
    "trajectory-analysis",
    "traffic-intelligence",
    "surrogate-safety",
    "anomaly-discovery",
    "intelligent-transportation-systems"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "shapely>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.4.0",
    "plotly>=5.18.0",
    "streamlit>=1.29.0",
    "jinja2>=3.1.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.1.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[project.scripts]
traffic-intelligence = "traffic_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_intelligence*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501", "B008"]
