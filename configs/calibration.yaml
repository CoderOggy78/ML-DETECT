calibration:
  mode: "auto" # "homography", "telemetry", "scale_factor", "auto", "pixel"
  
  # Option A: Planar Homography using image points -> world meters points
  # Provide at least 4 coplanar correspondence points (e.g. road markings, lane widths, intersection box)
  homography:
    image_points: [] # e.g. [[100.0, 200.0], [500.0, 200.0], [500.0, 800.0], [100.0, 800.0]]
    world_points: [] # e.g. [[0.0, 0.0], [30.0, 0.0], [30.0, 60.0], [0.0, 60.0]] in meters
    matrix: null     # Optional precomputed 3x3 homography matrix

  # Option B: Telemetry & Camera Pinhole Model
  telemetry:
    camera:
      focal_length_mm: 24.0
      sensor_width_mm: 13.2
      sensor_height_mm: 8.8
      principal_point: null # [cx, cy] defaults to image center if null
    default_altitude_m: 50.0
    default_pitch_deg: -90.0 # -90 is nadir (straight down)
    default_roll_deg: 0.0
    default_yaw_deg: 0.0

  # Option C: Simple Scale Factor (meters per pixel - Ground Sample Distance GSD)
  scale:
    meters_per_pixel: 0.05 # 5 cm per pixel default aerial resolution
    origin_image_coord: [0.0, 0.0]
